name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: sqlite, mbstring

      - name: Install PHPStan
        run: |
          curl -L https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar -o phpstan.phar
          chmod +x phpstan.phar

      - name: PHPStan (max level required)
        run: ./phpstan.phar analyse -c phpstan.neon.dist --memory-limit=1G --error-format=github --no-progress

      - name: Install Psalm
        run: |
          curl -L https://github.com/vimeo/psalm/releases/latest/download/psalm.phar -o psalm.phar
          chmod +x psalm.phar

      - name: Psalm (optional)
        continue-on-error: true
        run: ./psalm.phar --output-format=github --no-progress

      - name: Lint cron entrypoint
        run: php -l backend/cron/cron.php

      - name: Lint workflow helper
        run: php -l backend/includes/workflow_helper.php

      - name: Integration tests
        run: php test_integration.php
