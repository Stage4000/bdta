name: PHPStan PR Scan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  phpstan:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run PHPStan level 9
        uses: php-actions/phpstan@v3
        with:
          version: latest
          configuration: phpstan.neon
          level: 9
          path: backend blog client portal index.php page.php test_crud.php test_database.php test_integration.php test_packages.php test_portal_credit_booking.php test_unified_credits.php
