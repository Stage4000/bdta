name: Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: '8.2'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Node setup
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node tools
        run: |
          npm install -g eslint
          npm install -g stylelint
          npm install -g htmlhint

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep==1.155.0

      # -------------------------
      # Run JS lint
      # -------------------------
      - name: Run ESLint
        run: |
          eslint . --ext .js,.jsx,.ts,.tsx

      # -------------------------
      # Run CSS lint
      # -------------------------
      - name: Run Stylelint
        run: |
          stylelint "**/*.{css,scss}"

      # -------------------------
      # Run HTML lint
      # -------------------------
      - name: Run HTMLHint
        run: |
          htmlhint "**/*.html"

      # -------------------------
      # Security scan
      # -------------------------
      - name: Run Semgrep
        run: |
          semgrep --config=auto

      # -------------------------
      # PHPStan
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Run PHPStan
        uses: php-actions/phpstan@v3
        with:
          version: 2.1.40
          php_version: ${{ env.PHP_VERSION }}
          configuration: phpstan.neon
