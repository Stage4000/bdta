name: Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: '8.2'

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # -------------------------
      # Node setup
      # -------------------------
      - name: Setup Node
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Python
        id: setup_python
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Node tools
        id: install_node_tools
        if: ${{ always() }}
        continue-on-error: true
        run: |
          npm install -g eslint
          npm install -g stylelint
          npm install -g htmlhint

      - name: Install Semgrep
        id: install_semgrep
        if: ${{ always() }}
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep==1.155.0

      # -------------------------
      # Run JS lint
      # -------------------------
      - name: Run ESLint
        id: eslint
        if: ${{ always() }}
        continue-on-error: true
        run: |
          eslint . --config eslint.config.cjs

      # -------------------------
      # Run CSS lint
      # -------------------------
      - name: Run Stylelint
        id: stylelint
        if: ${{ always() }}
        continue-on-error: true
        run: |
          stylelint "**/*.{css,scss}" --config stylelint.config.cjs

      # -------------------------
      # Run HTML lint
      # -------------------------
      - name: Run HTMLHint
        id: htmlhint
        if: ${{ always() }}
        continue-on-error: true
        run: |
          htmlhint "**/*.html" --config .htmlhintrc

      # -------------------------
      # Security scan
      # -------------------------
      - name: Run Semgrep
        id: semgrep
        if: ${{ always() }}
        continue-on-error: true
        run: |
          semgrep scan --config=auto --error

      # -------------------------
      # PHPStan
      # -------------------------
      - name: Setup PHP
        id: setup_php
        if: ${{ always() }}
        continue-on-error: true
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite

      - name: Run survey integrity regressions
        id: survey_integrity
        if: ${{ always() && steps.setup_php.outcome == 'success' }}
        continue-on-error: true
        run: |
          php tests/test_public_form_submission_integrity.php
          php tests/test_survey_template_integrity.php
          php tests/test_survey_response_integrity.php
          php tests/test_survey_results.php

      - name: Run PHPStan
        id: phpstan
        if: ${{ always() }}
        continue-on-error: true
        run: |
          curl -LsS -o phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.40/phpstan.phar
          php phpstan.phar analyse --configuration=phpstan.neon --no-progress --memory-limit=1G

      - name: Summarize static analysis results
        if: ${{ always() }}
        run: |
          failures=()

          [ "${{ steps.setup_node.outcome }}" = "failure" ] && failures+=("Setup Node")
          [ "${{ steps.setup_python.outcome }}" = "failure" ] && failures+=("Setup Python")
          [ "${{ steps.install_node_tools.outcome }}" = "failure" ] && failures+=("Install Node tools")
          [ "${{ steps.install_semgrep.outcome }}" = "failure" ] && failures+=("Install Semgrep")
          [ "${{ steps.eslint.outcome }}" = "failure" ] && failures+=("ESLint")
          [ "${{ steps.stylelint.outcome }}" = "failure" ] && failures+=("Stylelint")
          [ "${{ steps.htmlhint.outcome }}" = "failure" ] && failures+=("HTMLHint")
          [ "${{ steps.semgrep.outcome }}" = "failure" ] && failures+=("Semgrep")
          [ "${{ steps.setup_php.outcome }}" = "failure" ] && failures+=("Setup PHP")
          [ "${{ steps.phpstan.outcome }}" = "failure" ] && failures+=("PHPStan")
          [ "${{ steps.survey_integrity.outcome }}" = "failure" ] && failures+=("Survey integrity regressions")

          if [ ${#failures[@]} -eq 0 ]; then
            echo "All static analysis steps completed successfully." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Static analysis failures"
            echo
            for failure in "${failures[@]}"; do
              echo "- ${failure}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'Static analysis failures detected:\n' >&2
          printf ' - %s\n' "${failures[@]}" >&2
          exit 1
