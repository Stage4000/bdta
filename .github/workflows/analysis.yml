name: Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: '8.2'
    services:
      audit_mysql:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: synthetic-audit-fixture
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # -------------------------
      # Node setup
      # -------------------------
      - name: Setup Node
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Python
        id: setup_python
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Node tools
        id: install_node_tools
        if: ${{ always() }}
        continue-on-error: true
        run: |
          npm install -g eslint
          npm install -g stylelint
          npm install -g htmlhint

      - name: Install Semgrep
        id: install_semgrep
        if: ${{ always() }}
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep==1.155.0

      # -------------------------
      # Run JS lint
      # -------------------------
      - name: Run ESLint
        id: eslint
        if: ${{ always() }}
        continue-on-error: true
        run: |
          eslint . --config eslint.config.cjs

      # -------------------------
      # Run CSS lint
      # -------------------------
      - name: Run Stylelint
        id: stylelint
        if: ${{ always() }}
        continue-on-error: true
        run: |
          stylelint "**/*.{css,scss}" --config stylelint.config.cjs

      # -------------------------
      # Run HTML lint
      # -------------------------
      - name: Run HTMLHint
        id: htmlhint
        if: ${{ always() }}
        continue-on-error: true
        run: |
          htmlhint "**/*.html" --config .htmlhintrc

      # -------------------------
      # Security scan
      # -------------------------
      - name: Run Semgrep
        id: semgrep
        if: ${{ always() }}
        continue-on-error: true
        run: |
          semgrep scan --config=auto --error

      # -------------------------
      # PHPStan
      # -------------------------
      - name: Setup PHP
        id: setup_php
        if: ${{ always() }}
        continue-on-error: true
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, pdo_sqlite, mbstring, fileinfo

      - name: Run audit MySQL regressions
        id: audit_mysql
        if: ${{ always() && steps.setup_php.outcome == 'success' }}
        continue-on-error: true
        env:
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3307'
          DB_NAME: bdta_p1_ci
          DB_USER: root
          DB_PASSWORD: synthetic-audit-fixture
          BDTA_REFUND_TEST_DISPOSABLE: '1'
          BDTA_MIGRATION_TEST_PORT: '3307'
          BDTA_MIGRATION_TEST_USER: root
          BDTA_MIGRATION_TEST_PASSWORD: synthetic-audit-fixture
          BDTA_ADMIN_TEST_PORT: '3307'
          BDTA_ADMIN_TEST_USER: root
          BDTA_ADMIN_TEST_PASSWORD: synthetic-audit-fixture
          BDTA_CHECKOUT_TEST_PORT: '3307'
          BDTA_CHECKOUT_TEST_USER: root
          BDTA_CHECKOUT_TEST_PASSWORD: synthetic-audit-fixture
        run: |
          php -d allow_url_fopen=0 -d disable_functions=mail,curl_init,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,socket_create,socket_connect -r '$c = new PDO("mysql:host=127.0.0.1;port=3307", getenv("DB_USER"), getenv("DB_PASSWORD")); $c->exec("CREATE DATABASE bdta_p1_ci CHARACTER SET utf8mb4"); echo "Disposable MariaDB ", $c->query("SELECT VERSION()")->fetchColumn(), PHP_EOL;'
          php -d allow_url_fopen=0 -d disable_functions=mail,curl_init,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,socket_create,socket_connect tests/test_legacy_package_schema_preservation.php
          php -d allow_url_fopen=0 -d disable_functions=mail,curl_init,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,socket_create,socket_connect tests/test_client_admin_mutation_guards.php
          php -d allow_url_fopen=0 -d disable_functions=mail,curl_init,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,socket_create,socket_connect tests/test_invoice_refund_retry.php
          php -d allow_url_fopen=0 -d disable_functions=mail,curl_init,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,socket_create,socket_connect tests/test_offline_package_checkout_retries.php

      - name: Run survey integrity regressions
        id: survey_integrity
        if: ${{ always() && steps.setup_php.outcome == 'success' }}
        continue-on-error: true
        run: |
          php tests/test_public_form_submission_integrity.php
          php tests/test_survey_template_integrity.php
          php tests/test_survey_response_integrity.php
          php tests/test_survey_results.php

      - name: Run reminder login regressions
        id: reminder_login
        if: ${{ always() && steps.setup_php.outcome == 'success' }}
        continue-on-error: true
        run: |
          php tests/test_portal_reminder_login.php
          php tests/test_booking_action_links.php
          php tests/test_public_portal_return_links.php

      - name: Run public booking identity regressions
        id: public_booking_identity
        if: ${{ always() && steps.setup_php.outcome == 'success' }}
        continue-on-error: true
        run: |
          php tests/test_public_booking_identity.php
          php tests/test_registered_address_booking_regression.php
          php tests/test_portal_credit_booking_pet_overwrite_followups.php

      - name: Run PHPStan
        id: phpstan
        if: ${{ always() }}
        continue-on-error: true
        run: |
          curl -LsS -o phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.40/phpstan.phar
          php phpstan.phar analyse --configuration=phpstan.neon --no-progress --memory-limit=1G

      - name: Run pet file regressions
        id: pet_files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          php tests/test_pet_file_paths.php
          python tests/test_pet_files_http.py

      - name: Summarize static analysis results
        if: ${{ always() }}
        run: |
          failures=()

          [ "${{ steps.setup_node.outcome }}" = "failure" ] && failures+=("Setup Node")
          [ "${{ steps.setup_python.outcome }}" = "failure" ] && failures+=("Setup Python")
          [ "${{ steps.install_node_tools.outcome }}" = "failure" ] && failures+=("Install Node tools")
          [ "${{ steps.install_semgrep.outcome }}" = "failure" ] && failures+=("Install Semgrep")
          [ "${{ steps.eslint.outcome }}" = "failure" ] && failures+=("ESLint")
          [ "${{ steps.stylelint.outcome }}" = "failure" ] && failures+=("Stylelint")
          [ "${{ steps.htmlhint.outcome }}" = "failure" ] && failures+=("HTMLHint")
          [ "${{ steps.semgrep.outcome }}" = "failure" ] && failures+=("Semgrep")
          [ "${{ steps.setup_php.outcome }}" = "failure" ] && failures+=("Setup PHP")
          [ "${{ steps.phpstan.outcome }}" = "failure" ] && failures+=("PHPStan")
          [ "${{ steps.audit_mysql.outcome }}" = "failure" ] && failures+=("Audit MySQL regressions")
          [ "${{ steps.survey_integrity.outcome }}" = "failure" ] && failures+=("Survey integrity regressions")
          [ "${{ steps.reminder_login.outcome }}" = "failure" ] && failures+=("Reminder login regressions")
          [ "${{ steps.public_booking_identity.outcome }}" = "failure" ] && failures+=("Public booking identity regressions")
          [ "${{ steps.pet_files.outcome }}" = "failure" ] && failures+=("Pet file regressions")

          if [ ${#failures[@]} -eq 0 ]; then
            echo "All static analysis steps completed successfully." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Static analysis failures"
            echo
            for failure in "${failures[@]}"; do
              echo "- ${failure}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'Static analysis failures detected:\n' >&2
          printf ' - %s\n' "${failures[@]}" >&2
          exit 1
